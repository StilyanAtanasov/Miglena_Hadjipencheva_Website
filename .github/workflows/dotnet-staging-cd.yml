name: .NET Core CD (Staging)

on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    name: Publish and Deploy (Staging)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore MHAuthorWebsite/MHAuthorWebsite.sln

    - name: Publish Web Project
      run: dotnet publish MHAuthorWebsite/MHAuthorWebsite.Web/MHAuthorWebsite.Web.csproj --configuration Staging --output ./publish

    - name: Set Environment Variable in web.config
      run: sed -i '/<aspNetCore/a \ \ \ \ \ \ <environmentVariables>\n        <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Staging" />\n      </environmentVariables>' ./publish/web.config

    - name: Create App Offline File
      run: |
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><h1>Обновяване на сайта</h1><p>Ще се върнем скоро.</p></body></html>' > ./publish/app_offline.htm

    - name: Take App Offline
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.STAGING_FTP_SERVER }}
        username: ${{ secrets.STAGING_FTP_USERNAME }}
        password: ${{ secrets.STAGING_FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
        exclude: |
          **
          !app_offline.htm

    - name: Wait for process to exit
      run: sleep 10

    - name: Deploy via FTP (Staging)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.STAGING_FTP_SERVER }}
        username: ${{ secrets.STAGING_FTP_USERNAME }}
        password: ${{ secrets.STAGING_FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
        dangerous-clean-slate: false
        exclude: |
          **/app_offline.htm

    - name: Bring App Online
      run: |
        curl -u "${{ secrets.STAGING_FTP_USERNAME }}:${{ secrets.STAGING_FTP_PASSWORD }}" \
             "ftp://${{ secrets.STAGING_FTP_SERVER }}/" \
             -Q "DELE app_offline.htm"
      continue-on-error: true